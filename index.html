<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Resale Mob</title>

  <meta
    name="theme-color"
    content="#ffffff"
    id="theme-color-meta"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    href="icon-192.png"
  >

  <link rel="stylesheet" href="buyer.css">
</head>

<body>
  <main>
    <header
      id="buyer-header"
    >
      <h1
        id="buyer-page-title"
      >
        Resale Mob
      </h1>

      <div
        id="buyer-header-actions"
      >
        <details
          id="buyer-account-entry"
        >
          <summary>
            Login
          </summary>

          <div
            id="buyer-account-panel"
          >
            <h2>
              Login
            </h2>

            <form
              id="buyer-account-form"
              onsubmit="return false;"
            >
              <label
                for="buyer-account-email"
              >
                Email
              </label>

              <input
                id="buyer-account-email"
                type="email"
                autocomplete="email"
                required
              >

              <label
                for="buyer-account-password"
              >
                Password
              </label>

              <input
                id="buyer-account-password"
                type="password"
                autocomplete="current-password"
                minlength="8"
                required
              >

              <button
                type="submit"
              >
                Log In
              </button>
            </form>

            <div
              id="buyer-account-links"
            >
              <button
                id="buyer-create-account-link"
                type="button"
              >
                Create Account
              </button>

              <button
                id="buyer-recover-link"
                type="button"
              >
                Recover Password
              </button>
            </div>
          </div>
        </details>

        <div
          id="buyer-info-menu-wrapper"
          hidden
        >
          <button
            id="buyer-info-button"
            type="button"
            aria-expanded="false"
          >
            Info ▾
          </button>

          <div
            id="buyer-info-dropdown"
            hidden
          ></div>
        </div>
      </div>
    </header>

    <section
      id="buyer-featured-section"
    >
      <h2
        id="buyer-featured-title"
      >
        Featured
      </h2>

      <div
        id="buyer-featured-carousel"
      >
        <button
          id="buyer-featured-previous"
          class="buyer-featured-carousel-button"
          type="button"
          aria-label="Previous featured item"
          title="Previous featured item"
          hidden
        >
          ‹
        </button>

        <div
          id="buyer-grid"
        >
          <div
            id="buyer-position-1"
          ></div>

          <div
            id="buyer-position-2"
          ></div>

          <div
            id="buyer-position-3"
          ></div>
        </div>

        <button
          id="buyer-featured-next"
          class="buyer-featured-carousel-button"
          type="button"
          aria-label="Next featured item"
          title="Next featured item"
          hidden
        >
          ›
        </button>
      </div>

      <p
        id="buyer-featured-message"
      ></p>
    </section>

    <section
      id="buyer-catalog-section"
    >
      <div
        id="buyer-catalog-toolbar"
      >
        <div
          id="buyer-catalog-title-zone"
        >
          <h2
            id="buyer-catalog-title"
          >
            Published Catalog
          </h2>
        </div>

        <div
          id="buyer-catalog-reserved-zone"
          aria-hidden="true"
        ></div>

        <div
          id="buyer-catalog-controls-zone"
        ></div>
      </div>

      <div
        id="buyer-catalog-grid"
      ></div>

      <p
        id="buyer-catalog-message"
      ></p>
    </section>

    <p
      id="buyer-message"
    ></p>
  </main>

  <div
    id="buyer-item-modal"
    hidden
  >
    <div
      id="buyer-item-modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="buyer-item-modal-title"
    >
      <div
        id="buyer-item-modal-header"
      >
        <h2
          id="buyer-item-modal-title"
        ></h2>

        <button
          id="buyer-item-modal-x"
          type="button"
          aria-label="Close item details"
          title="Close"
        >
          ×
        </button>
      </div>

      <div
        id="buyer-item-modal-content"
      ></div>

      <button
        id="buyer-item-modal-close"
        type="button"
      >
        Close
      </button>
    </div>
  </div>

  <div
    id="buyer-info-modal"
    hidden
  >
    <div
      id="buyer-info-modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="buyer-info-modal-title"
    >
      <div
        id="buyer-info-modal-header"
      >
        <h2
          id="buyer-info-modal-title"
        ></h2>

        <button
          id="buyer-info-modal-x"
          type="button"
          aria-label="Close"
          title="Close"
        >
          ×
        </button>
      </div>

      <div
        id="buyer-info-modal-content"
      ></div>

      <button
        id="buyer-info-modal-close"
        type="button"
      >
        Close
      </button>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="supabase.js"
  ></script>

  <script
    src="buyer-account.js"
  ></script>

  <script

  src="buyer-storefront.js"
>   </script>
  <script
    src="buyer-item-display.js"
  ></script>
  <script
    src="buyer.js"
  ></script>
  <script>
    if (
      "serviceWorker"
      in navigator
    ) {
      navigator.serviceWorker.register(
        "service-worker.js"
      );
    }
  </script>
</body>
</html>
