<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Resale Mob</title>

  <meta
    name="theme-color"
    content="#ffffff"
    id="theme-color-meta"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    href="icon-192.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #ffffff;
      color: #111111;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    #buyer-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    #buyer-page-title {
      margin: 0;
    }

    #buyer-info-menu-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    #buyer-info-button {
      min-height: 36px;
      padding: 6px 12px;
    }

    #buyer-info-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;

      min-width: 160px;

      padding: 6px;

      background: #ffffff;

      border:
        1px solid #cfcfcf;

      border-radius: 8px;

      z-index: 20;
    }

    #buyer-info-dropdown[hidden] {
      display: none;
    }

    .buyer-info-menu-option {
      display: block;

      width: 100%;

      padding: 9px 10px;

      text-align: left;

      background: #ffffff;

      border: 0;

      cursor: pointer;
    }

    .buyer-info-menu-option:hover {
      background: #f1f1f1;
    }

    #buyer-info-modal {
      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(
          0,
          0,
          0,
          0.45
        );

      z-index: 100;
    }

    #buyer-info-modal[hidden] {
      display: none;
    }

    #buyer-info-modal-card {
      width: min(
        520px,
        100%
      );

      max-height: 80vh;

      overflow-y: auto;

      padding: 20px;

      background: #ffffff;

      border-radius: 12px;
    }

    #buyer-info-modal-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 16px;

      margin-bottom: 16px;
    }

    #buyer-info-modal-title {
      margin: 0;
    }

    #buyer-info-modal-x {
      min-width: 36px;
      min-height: 36px;

      font-size: 20px;
      line-height: 1;
    }

    #buyer-info-modal-close {
      margin-top: 18px;
    }

    .buyer-info-line,
    .buyer-hours-line {
      margin: 6px 0;
    }

    .buyer-online-only {
      font-weight: 700;
    }

    #buyer-sort-anchor {
      margin-bottom: 18px;
    }

    /*
      CURRENT DEVELOPMENT BENCHMARK

      150px is the provisional minimum
      buyer-card width.

      It is intentionally easy to change
      after later mobile/design review.
    */
    #buyer-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            min(
              150px,
              100%
            ),
            1fr
          )
        );

      gap: 16px;
      width: 100%;
      align-items: start;
    }

    #buyer-position-1,
    #buyer-position-2,
    #buyer-position-3 {
      width: 100%;
      min-width: 0;
    }

    .buyer-card {
      container-type: inline-size;

      width: 100%;
      min-width: 0;
    }

    .buyer-slide-controls {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      margin-bottom: 12px;
    }

    .buyer-slide-button {
      min-width: 36px;
      min-height: 36px;

      padding: 4px 8px;

      font-size: 18px;
      line-height: 1;
    }

    .buyer-slide-counter {
      min-width: 40px;

      text-align: center;
      font-weight: 600;
    }

    #buyer-message {
      margin-top: 20px;
    }

    #buyer-message.coming-soon {
      width: 100%;

      padding: 48px 20px;

      text-align: center;

      font-size: 28px;
      font-weight: 700;

      border:
        1px solid #d8d8d8;

      border-radius: 12px;

      background: #ffffff;
    }
  </style>
</head>

<body>
  <main>
    <header
      id="buyer-header"
    >
      <h1
        id="buyer-page-title"
      >
        Resale Mob
      </h1>

      <div
        id="buyer-info-menu-wrapper"
        hidden
      >
        <button
          id="buyer-info-button"
          type="button"
          aria-expanded="false"
        >
          Info ▾
        </button>

        <div
          id="buyer-info-dropdown"
          hidden
        ></div>
      </div>
    </header>

    <section>
      <h2>
        Available Items
      </h2>

      <div
        id="buyer-sort-anchor"
      ></div>

      <div
        id="buyer-grid"
      >
        <div
          id="buyer-position-1"
        ></div>

        <div
          id="buyer-position-2"
        ></div>

        <div
          id="buyer-position-3"
        ></div>
      </div>

      <p
        id="buyer-message"
      ></p>
    </section>
  </main>

  <div
    id="buyer-info-modal"
    hidden
  >
    <div
      id="buyer-info-modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="buyer-info-modal-title"
    >
      <div
        id="buyer-info-modal-header"
      >
        <h2
          id="buyer-info-modal-title"
        ></h2>

        <button
          id="buyer-info-modal-x"
          type="button"
          aria-label="Close"
          title="Close"
        >
          ×
        </button>
      </div>

      <div
        id="buyer-info-modal-content"
      ></div>

      <button
        id="buyer-info-modal-close"
        type="button"
      >
        Close
      </button>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="supabase.js"
  ></script>

  <script
    src="buyer.js"
  ></script>

  <script>
    if (
      "serviceWorker"
      in navigator
    ) {
      navigator.serviceWorker.register(
        "service-worker.js"
      );
    }
  </script>
</body>
</html>
