<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resale Mob — Seller</title>
</head>

<body>
  <main>
    <h1>Resale Mob</h1>
    <h2>Seller Login</h2>

    <section id="login-section">
      <form id="login-form">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          required
        >

        <button type="submit">Log In</button>
      </form>

      <p id="login-message"></p>
    </section>

    <section id="seller-section" hidden>
      <p>Seller logged in.</p>
      <button id="logout-button" type="button">Log Out</button>

      <hr>

      <h2>Seller Dashboard</h2>

      <nav id="seller-dashboard">
        <button id="dashboard-add-item" type="button">Add Item</button>
        <button id="dashboard-edit-items" type="button">Edit / Delete Items</button>
        <button id="dashboard-claims" type="button">Claims</button>
        <button id="dashboard-seller-page" type="button">Seller Page Setup</button>
        <button id="dashboard-categories" type="button">Categories</button>
      </nav>

      <hr>

      <section id="add-item-section" hidden>
        <h2>Add Item</h2>

        <form id="item-form">
          <div>
            <label for="item-image-1">Product Picture 1</label>
            <input
              type="file"
              id="item-image-1"
              accept="image/jpeg,image/png,image/webp"
              required
            >
          </div>

          <div>
            <label for="item-image-2">Product Picture 2</label>
            <input
              type="file"
              id="item-image-2"
              accept="image/jpeg,image/png,image/webp"
            >
          </div>

          <div>
            <label for="item-image-3">Product Picture 3</label>
            <input
              type="file"
              id="item-image-3"
              accept="image/jpeg,image/png,image/webp"
            >
          </div>

          <div>
            <label for="item-image-4">Product Picture 4</label>
            <input
              type="file"
              id="item-image-4"
              accept="image/jpeg,image/png,image/webp"
            >
          </div>

          <label for="item-name">Item Name</label>
          <input
            type="text"
            id="item-name"
            required
          >

          <label for="item-price">Price</label>
          <input
            type="number"
            id="item-price"
            min="0"
            step="0.01"
            required
          >

          <label for="item-description">Description</label>
          <textarea
            id="item-description"
            required
          ></textarea>

          <label for="item-category">Category</label>
          <select id="item-category">
            <option value="">No Category</option>
          </select>

          <button type="submit">Add Item</button>
        </form>

        <p id="item-message"></p>
      </section>

      <section id="edit-items-section" hidden>
        <h2>Edit / Delete Items</h2>
        <div id="inventory-list"></div>
      </section>

      <section id="claims-section" hidden>
        <h2>Claims</h2>
        <p>Claims work area.</p>
      </section>

      <section id="seller-page-section" hidden>
        <h2>Seller Page Setup</h2>
        <p>Seller Page Setup work area.</p>
      </section>

      <section id="categories-section" hidden>
        <h2>Categories</h2>

        <form id="category-form">
          <label for="category-name">Category Name</label>
          <input
            type="text"
            id="category-name"
            required
          >

          <button type="submit">Add Category</button>
        </form>

        <p id="category-message"></p>

        <h3>Current Categories</h3>
        <div id="category-list"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="seller.js"></script>
</body>
</html>
